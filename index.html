<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sergei Markelov</title>
    <meta name="description" content="Sergei Markelov personal site.">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Disable scrolling */
        }
        body {
            background: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Press Start 2P', cursive;
            font-size: 24px;
            position: relative;
        }
        canvas {
            border: 1px solid white;
            z-index: 1;
        }
        #message, #secondMessage {
            display: none;
            font-size: 27px; /* Default size minus 5pt */
            color: cyan;
            text-shadow: 0 0 5px cyan, 0 0 10px cyan, 0 0 20px cyan, 0 0 30px cyan, 0 0 40px cyan;
        }
        #thankYouMessage {
            font-size: 12px; /* Same as input text size */
            color: cyan;
            text-shadow: 0 0 5px cyan, 0 0 10px cyan, 0 0 20px cyan, 0 0 30px cyan, 0 0 40px cyan;
            text-align: center;
            display: none;
        }
        #popupMenu {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            background: #222;
            padding: 10px;
            border: 2px solid #fff;
            border-radius: 5px;
            font-family: 'Press Start 2P', cursive;
            text-align: center;
        }
        #popupMenu button {
            display: block;
            width: 120px;
            padding: 10px 0;
            margin: 5px 0;
            background: #333;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 3px;
            font-size: 14px;
        }
        #popupMenu button:hover {
            background: #555;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .blink {
            animation: blink 1s infinite;
        }
        .glitch {
            font-size: 30px;
            font-weight: bold;
            color: white;
            position: relative;
            animation: glitch 1s infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .glitch-line {
            display: inline-block;
        }
        .glitch:before,
        .glitch:after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }
        .glitch:before {
            left: 2px;
            text-shadow: -2px 0 red;
            clip: rect(12px, 500px, 45px, 0); /* Adjusted for wider text */
            animation: glitch 1s infinite linear alternate-reverse;
        }
        .glitch:after {
            left: -2px;
            text-shadow: -2px 0 blue;
            clip: rect(42px, 500px, 70px, 0); /* Adjusted for wider text */
            animation: glitch 1s infinite linear alternate-reverse;
        }
        @keyframes glitch {
            0% {
                clip: rect(28px, 500px, 22px, 0);
                transform: skew(0.5deg);
            }
            5% {
                clip: rect(6px, 500px, 15px, 0);
                transform: skew(0.5deg);
            }
            10% {
                clip: rect(43px, 500px, 25px, 0);
                transform: skew(0.5deg);
            }
            15% {
                clip: rect(38px, 500px, 13px, 0);
                transform: skew(0.5deg);
            }
            20% {
                clip: rect(18px, 500px, 9px, 0);
                transform: skew(0.5deg);
            }
            25% {
                clip: rect(39px, 500px, 36px, 0);
                transform: skew(0.5deg);
            }
            30% {
                clip: rect(7px, 500px, 18px, 0);
                transform: skew(0.5deg);
            }
            35% {
                clip: rect(27px, 500px, 45px, 0);
                transform: skew(0.5deg);
            }
            40% {
                clip: rect(6px, 500px, 11px, 0);
                transform: skew(0.5deg);
            }
            45% {
                clip: rect(23px, 500px, 8px, 0);
                transform: skew(0.5deg);
            }
            50% {
                clip: rect(6px, 500px, 19px, 0);
                transform: skew(0.5deg);
            }
            55% {
                clip: rect(13px, 500px, 16px, 0);
                transform: skew(0.5deg);
            }
            60% {
                clip: rect(44px, 500px, 30px, 0);
                transform: skew(0.5deg);
            }
            65% {
                clip: rect(7px, 500px, 32px, 0);
                transform: skew(0.5deg);
            }
            70% {
                clip: rect(12px, 500px, 9px, 0);
                transform: skew(0.5deg);
            }
            75% {
                clip: rect(20px, 500px, 11px, 0);
                transform: skew(0.5deg);
            }
            80% {
                clip: rect(22px, 500px, 27px, 0);
                transform: skew(0.5deg);
            }
            85% {
                clip: rect(11px, 500px, 20px, 0);
                transform: skew(0.5deg);
            }
            90% {
                clip: rect(25px, 500px, 20px, 0);
                transform: skew(0.5deg);
            }
            95% {
                clip: rect(10px, 500px, 27px, 0);
                transform: skew(0.5deg);
            }
            100% {
                clip: rect(16px, 500px, 20px, 0);
                transform: skew(0.5deg);
            }
        }
        #spaceship-container {
            display: none;
            position: relative;
            width: 400px;
            height: 400px;
            margin-top: 20px;
        }
        #spaceship {
            width: 100%;
            height: 100%;
            position: absolute;
        }
        .trace {
            position: absolute;
            width: 5px;
            height: 3px;
            background: cyan;
            opacity: 0.7;
            animation: moveTrace 1s steps(8) infinite;
        }
        @keyframes moveTrace {
            0% { transform: translate(200px, -200px); }
            100% { transform: translate(0, 400px); }
        }
        @media (max-width: 1000px) {
            .glitch {
                font-size: 20px; /* Reduced font size for tablets and smartphones */
            }
            #message, #secondMessage {
                font-size: 22px; /* Reduced font size for messages on tablets and smartphones */
            }
            #game {
                width: 300px; /* Optional reduced width for canvas */
                height: 300px; /* Optional reduced height for canvas */
                margin-top: 10px;
            }
            #touchControls {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-top: 10px;
            }
            .touch-button {
                width: 40px !important;
                height: 40px !important;
                background: #333 !important;
                border-radius: 5px !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                font-size: 24px !important;
                color: white !important; /* Unified color for the arrows */
                cursor: pointer !important;
                user-select: none !important;
                border: 1px solid white !important;
                margin: 2px !important;
                box-sizing: border-box !important;
                -webkit-appearance: none !important; /* Remove default styling */
                -moz-appearance: none !important; /* Remove default styling */
                appearance: none !important; /* Remove default styling */
                background-image: none !important; /* Remove any default background images */
                padding: 0 !important; /* Reset padding */
                outline: none !important; /* Remove default outline */
                box-shadow: none !important; /* Remove any box-shadow */
            }
            .touch-button-grid {
                display: grid !important;
                grid-template-areas:
                    ". up ."
                    "left . right"
                    ". down .";
                grid-template-columns: 1fr auto 1fr !important;
                grid-gap: 2px !important; /* Adjusted gap to match button size */
            }
            .touch-button.up { grid-area: up !important; }
            .touch-button.down { grid-area: down !important; }
            .touch-button.left { grid-area: left !important; }
            .touch-button.right { grid-area: right !important; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glitch" data-text="HI THERE! clic to play" id="glitchMessage">
        <span class="glitch-line">HI THERE!</span>
        <span class="glitch-line">click to play</span>
    </div>
    <canvas width="400" height="400" id="game"></canvas>
    <div id="message">YOU WON</div>
    <div id="secondMessage">HAVE A NICE DAY</div>
    <div id="spaceship-container">
        <img id="spaceship" src="https://i.postimg.cc/bvd8T86f/temp-Image251-Ju-U.avif" alt="spaceship">
        <div class="trace" style="top: 0; left: 0;"></div>
        <div class="trace" style="top: 80px; left: 80px;"></div>
        <div class="trace" style="top: 160px; left: 160px;"></div>
        <div class="trace" style="top: 240px; left: 240px;"></div>
        <div class="trace" style="top: 320px; left: 320px;"></div>
    </div>
    <div id="popupMenu">
        <button type="button" onclick="window.location.href='mailto:film@sergeimarkelov.com'">EMAIL</button>
        <button type="button" onclick="window.location.reload()">REPLAY</button>
    </div>
    <div id="thankYouMessage">Thank you! Check your email</div>

    <!-- Touch Controls -->
    <div id="touchControls" style="display: none;">
        <div class="touch-button-grid">
            <div class="touch-button up" id="up">&#9650;</div>
            <div class="touch-button left" id="left">&#9664;</div>
            <div class="touch-button" style="visibility: hidden;"></div> <!-- Spacer button -->
            <div class="touch-button right" id="right">&#9654;</div>
            <div class="touch-button down" id="down">&#9660;</div>
        </div>
    </div>

    <script>
        var canvas = document.getElementById('game');
        var context = canvas.getContext('2d');
        var grid = 16;
        var count = 0;
        var snake = {
            x: 160,
            y: 160,
            dx: grid,
            dy: 0,
            cells: [],
            maxCells: 4
        };
        var apple = {
            x: 320,
            y: 320
        };
        var messageDuration = 3000; // 3 seconds
        var blocksCaught = 0;

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
        }

        function loop() {
            requestAnimationFrame(loop);
            if (++count < 8) {
                return;
            }
            count = 0;
            context.clearRect(0, 0, canvas.width, canvas.height);
            snake.x += snake.dx;
            snake.y += snake.dy;

            if (snake.x < 0) {
                snake.x = canvas.width - grid;
            } else if (snake.x >= canvas.width) {
                snake.x = 0;
            }

            if (snake.y < 0) {
                snake.y = canvas.height - grid;
            } else if (snake.y >= canvas.height) {
                snake.y = 0;
            }

            snake.cells.unshift({ x: snake.x, y: snake.y });

            if (snake.cells.length > snake.maxCells) {
                snake.cells.pop();
            }

            context.fillStyle = 'red';
            context.fillRect(apple.x, apple.y, grid - 1, grid - 1);

            context.fillStyle = 'green';
            snake.cells.forEach(function(cell, index) {
                context.fillRect(cell.x, cell.y, grid - 1, grid - 1);

                if (cell.x === apple.x && cell.y === apple.y) {
                    snake.maxCells++;
                    blocksCaught++;
                    if (blocksCaught >= 5) {
                        endGame();
                    }
                    apple.x = getRandomInt(0, 25) * grid;
                    apple.y = getRandomInt(0, 25) * grid;
                }

                for (var i = index + 1; i < snake.cells.length; i++) {
                    if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                        snake.x = 160;
                        snake.y = 160;
                        snake.cells = [];
                        snake.maxCells = 4;
                        snake.dx = grid;
                        snake.dy = 0;
                        apple.x = getRandomInt(0, 25) * grid;
                        apple.y = getRandomInt(0, 25) * grid;
                        blocksCaught = 0;
                    }
                }
            });
        }

        document.addEventListener('keydown', function(e) {
            // Prevent default action for arrow keys to avoid scrolling
            if ([37, 38, 39, 40].includes(e.which)) {
                e.preventDefault();
            }
            if (e.which === 37 && snake.dx === 0) {
                snake.dx = -grid;
                snake.dy = 0;
            } else if (e.which === 38 && snake.dy === 0) {
                snake.dy = -grid;
                snake.dx = 0;
            } else if (e.which === 39 && snake.dx === 0) {
                snake.dx = grid;
                snake.dy = 0;
            } else if (e.which === 40 && snake.dy === 0) {
                snake.dy = grid;
                snake.dx = 0;
            }
        });

        function endGame() {
            document.getElementById('glitchMessage').style.display = 'none';
            document.getElementById('game').style.display = 'none';
            document.getElementById('touchControls').style.display = 'none'; // Hide touch controls
            document.getElementById('message').style.display = 'block';
            setTimeout(function() {
                document.getElementById('message').style.display = 'none';
                document.getElementById('secondMessage').style.display = 'block';
                setTimeout(function() {
                    document.getElementById('secondMessage').style.display = 'none';
                    var spaceshipContainer = document.getElementById('spaceship-container');
                    spaceshipContainer.style.display = 'block'; // Show the spaceship container
                    setTimeout(function() {
                        document.getElementById('popupMenu').style.display = 'block';
                    }, 2000); // Do not show menu after the spaceship appears
                }, messageDuration);
            }, messageDuration);
        }

        window.addEventListener('load', function() {
            document.addEventListener('keydown', function(e) {
                if ([37, 38, 39, 40].includes(e.which)) {
                    e.preventDefault();
                    canvas.focus(); // Ensure the canvas is focused
                }
            });
            canvas.focus();
            requestAnimationFrame(loop);
        });

        // Show touch controls on smartphones and tablets
        function showTouchControls() {
            var touchControls = document.getElementById('touchControls');
            if (window.innerWidth <= 1000) {
                touchControls.style.display = 'flex';
            } else {
                touchControls.style.display = 'none';
            }
        }

        window.addEventListener('resize', showTouchControls);
        window.addEventListener('load', showTouchControls);

        // Handle touch events
        document.getElementById('left').addEventListener('touchstart', function() {
            if (snake.dx === 0) {
                snake.dx = -grid;
                snake.dy = 0;
            }
        });

        document.getElementById('up').addEventListener('touchstart', function() {
            if (snake.dy === 0) {
                snake.dy = -grid;
                snake.dx = 0;
            }
        });

        document.getElementById('down').addEventListener('touchstart', function() {
            if (snake.dy === 0) {
                snake.dy = grid;
                snake.dx = 0;
            }
        });

        document.getElementById('right').addEventListener('touchstart', function() {
            if (snake.dx === 0) {
                snake.dx = grid;
                snake.dy = 0;
            }
        });
    </script>
</body>
</html>
